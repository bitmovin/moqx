# Builds the relay image this fork ships and pushes it to GHCR under the fork.
#
# Runs on a tag like `v0.3.5-bm.1`: an upstream release plus our patch stack,
# numbered per rebuild. The image is `ghcr.io/bitmovin/moqx:<tag>`. On a tag,
# the `copy` job then copies that exact image, by digest, to Artifact Registry
# as `$GAR_IMAGE:<tag>`, the registry the relay box is meant to pull from: the
# GHCR package is private, and the box reads GAR with its own service account.
# The copy is keyless, and GCP trusts this repo's OIDC token only on a tag ref
# and only from this workflow file (ai-incubator-2026-infrastructure,
# modules/moq-relay/registry.tf), so a manual run on a branch stops at GHCR.
# A manual run on a tag copies too; it refuses to move a tag GAR already holds
# at another digest. The copy is its own job so the GCP token never exists
# during the build, which can outlast it, and so re-running a failed copy
# copies the verified image instead of rebuilding. amd64 only, because the box
# is. The moxygen stage comes from cmake/dependencies.cmake's pin: a fork
# revision has no published prebuilt, so the first build compiles moxygen and
# folly (about an hour on a hosted runner) and the registry buildcache carries
# that layer to every build after it until the pin moves.
name: bitmovin image

on:
  push:
    tags: ["v*-bm.*"]
  workflow_dispatch:

env:
  GAR_HOST: europe-west3-docker.pkg.dev
  GAR_IMAGE: europe-west3-docker.pkg.dev/ai-incubator-2026/moq-relay/moqx
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/182387543121/locations/global/workloadIdentityPools/moq-relay-image-ci/providers/github-oidc
  GCP_SERVICE_ACCOUNT: moq-relay-image-ci@ai-incubator-2026.iam.gserviceaccount.com

jobs:
  image:
    if: github.repository_owner == 'bitmovin'
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAG="${{ steps.tag.outputs.tag }}"
          docker buildx build -f docker/Dockerfile --target relay --push \
            --secret id=github_token,env=GITHUB_TOKEN \
            --build-arg MOQX_VERSION_STRING="$TAG" \
            --cache-from "type=registry,ref=${IMAGE}/buildcache:amd64" \
            --cache-to "type=registry,ref=${IMAGE}/buildcache:amd64,mode=max" \
            -t "${IMAGE}:${TAG}" \
            .
      - name: Verify the stamped version and linkage
        id: verify
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}"
          docker pull "$IMAGE"
          if docker run --rm --entrypoint ldd "$IMAGE" /usr/local/bin/moqx 2>&1 | grep -q "not found"; then
            echo "ERROR: missing shared libraries" >&2; exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/moqx "$IMAGE" --version
          echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

  copy:
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      packages: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        id: gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Copy to Artifact Registry
        env:
          GAR_TOKEN: ${{ steps.gcp.outputs.access_token }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SRC: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "$GAR_TOKEN" | docker login "$GAR_HOST" -u oauth2accesstoken --password-stdin
          DST="${GAR_IMAGE}:${TAG}"
          if EXISTING=$(docker buildx imagetools inspect "$DST" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            if [ "$EXISTING" = "$DIGEST" ]; then
              echo "$DST already holds $DIGEST"; exit 0
            fi
            echo "ERROR: $DST already holds $EXISTING, refusing to move it to $DIGEST; cut a new -bm tag" >&2
            exit 1
          fi
          docker buildx imagetools create -t "$DST" "$SRC"
          COPIED=$(docker buildx imagetools inspect "$DST" --format '{{.Manifest.Digest}}')
          echo "$DST $COPIED (source $DIGEST)"
          [ "$COPIED" = "$DIGEST" ]
